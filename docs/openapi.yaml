    "description": "Acceso y configuración. Identificadores, importes y tasas se envían como cadenas. Sesión HttpOnly, SameSite=Lax, Secure en producción; CSRF también en login. Configuración, tarifas y tasas requieren ADMIN. Incluye disponibilidad, cotización, confirmación pública idempotente y transiciones internas de reserva. Incluye apertura, ingresos, correcciones, finanzas, cierres inmutables y reportes PDF/XLSX."
