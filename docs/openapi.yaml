            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "writeOnly": true
          }
        },
        "required": [
          "username",
          "password"
        ]
      },
      "Csrf": {
        "type": "object",
        "properties": {
          "headerName": {
            "type": "string"
          },
          "token": {
            "type": "string"
          }
        },
        "required": [
          "headerName",
          "token"
        ]
      },
      "Translation": {
        "type": "object",
        "properties": {
          "locale": {
            "type": "string",
            "enum": [
              "es",
              "en",
              "pt"
            ]
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "description": {
            "type": "string",
            "maxLength": 4000
          },
          "services": {
            "type": "string",
            "maxLength": 4000
          }
        },
        "required": [
          "locale",
          "displayName",
          "description",
          "services"
        ]
      },
      "Hour": {
        "type": "object",
        "properties": {
          "weekday": {
            "type": "integer",
            "minimum": 1,
            "maximum": 7
          },
          "opensAt": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          },
          "closesAt": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          }
        },
        "required": [
          "weekday",
          "opensAt",
          "closesAt"
        ]
